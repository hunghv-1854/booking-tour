name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build:
    name: Lint & format / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint & format
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  test:
    name: Test / E2E testing / Database migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking_tour
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: booking_tour
      JWT_SECRET: ci-access-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ci-refresh-secret
      JWT_REFRESH_EXPIRES_IN: 7d
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      SEED_ADMIN_EMAIL: admin@booking-tour.local
      SEED_ADMIN_PASSWORD: Admin@123456
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Database migration
        run: |
          npm run migration:run
          npm run typeorm -- migration:generate src/database/migrations/SchemaCheck --check
          npm run migration:revert
          npm run migration:run

      - name: Seeder
        run: |
          npm run seed:admin
          npm run seed:admin

      - name: Test
        run: npm test

      - name: E2E testing
        run: npm run test:e2e
